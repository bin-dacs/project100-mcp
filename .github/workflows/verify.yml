# Prüflauf auf FREMDER Hardware.
#
# Das ist der Unterschied zu jedem anderen Test in diesem Projekt: er läuft auf
# GitHub-Rechnern, aus einem anderen Netz, ohne dass der Betreiber ihn startet.
# Ein Selbsttest auf der eigenen Maschine prüft die eigenen Annahmen; dieser
# Lauf prüft, ob der Dienst von AUSSEN das hält, was er verspricht.
#
# Und er ist ehrlich: erreicht er den Dienst nicht, wird er ROT. Ein Lauf, der
# bei Unerreichbarkeit grün bleibt, ist eine Lüge mit Häkchen.
name: verify

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"   # täglich 06:17 UTC, damit ein stiller Ausfall auffällt
  workflow_dispatch:

jobs:
  promises:
    name: Die Zusagen von aussen prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Die Kernzusagen abrufen
        run: |
          set -euo pipefail
          B=https://project100-7vk.pages.dev
          UA="Mozilla/5.0 (compatible; GitHub-Actions/1.0; +$B/llms.txt)"

          echo "── Anleitung ─────────────────────────────────────"
          code=$(curl -sS -o /tmp/llms.txt -w '%{http_code}' -A "$UA" "$B/llms.txt")
          echo "llms.txt HTTP $code"
          test "$code" = "200"
          grep -qi "project100" /tmp/llms.txt

          echo "── Arbeitsbrett, ohne Konto ──────────────────────"
          code=$(curl -sS -o /tmp/tasks.json -w '%{http_code}' -A "$UA" "$B/api/v1/tasks")
          echo "tasks HTTP $code"
          test "$code" = "200"
          node -e 'const d=require("/tmp/tasks.json"); if(!(d.tasks||[]).length) process.exit(1); console.log((d.tasks||[]).length+" Aufgaben")'

          echo "── Vorab prüfen, ohne Konto, ohne Wirkung ────────"
          code=$(curl -sS -o /tmp/check.json -w '%{http_code}' -A "$UA" \
            -X POST "$B/api/v1/tasks/check" -H 'content-type: application/json' \
            -d '{"task_id":"two-doors","payload":{"status_standard":200,"status_mit_agent":200,"werkzeug":"github-actions","befund":"gleich"}}')
          echo "tasks/check HTTP $code"
          test "$code" = "200"
          node -e 'const d=require("/tmp/check.json"); if(d.stored!==false) process.exit(1); console.log("would_be_accepted="+d.would_be_accepted+", nichts gespeichert")'

          echo "── MCP spricht JSON-RPC, nicht HTML ─────────────"
          curl -sS -A "$UA" -X POST "$B/mcp" -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}' -o /tmp/mcp.json
          node -e 'const d=require("/tmp/mcp.json"); const t=(d.result&&d.result.tools)||[]; if(!t.length) process.exit(1); console.log(t.length+" Werkzeuge über MCP")'

          echo "── Die Zahl, die zählt ───────────────────────────"
          curl -sS -A "$UA" "$B/api/v1/kpi" -o /tmp/kpi.json
          node -e 'const d=require("/tmp/kpi.json"); if(typeof d.headline!=="number") process.exit(1); console.log("KPI="+d.headline+", fremde Agenten="+d.foreign_agents)'

          echo "── Nicht mehr erreichbar? Dann ist es ein Befund ─"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -A "$UA" "$B/api/v1/limits")" = "200"

      - name: Die eine bekannte Wand dokumentieren
        run: |
          # Eine dokumentierte Kante darf kein Fehlschlag sein — aber eine
          # STUMME schon. Gemessen wird: entweder es geht, ODER der Client wird
          # auf /llms.txt gewarnt.
          B=https://project100-7vk.pages.dev
          code=$(curl -sS -o /dev/null -w '%{http_code}' "$B/api/v1/tasks" || echo 000)
          echo "python-urllib ohne User-Agent -> HTTP $code"
          if [ "$code" != "200" ]; then
            curl -sS "$B/llms.txt" | grep -qi "Python-urllib" \
              && echo "Wand dokumentiert — in Ordnung." \
              || { echo "STUMME WAND: der Client wird NICHT gewarnt."; exit 1; }
          fi

      - name: Der Eintritt ist kostenlos — gegengelesen
        run: |
          B=https://project100-7vk.pages.dev
          curl -sS "$B/api/v1/contract" -o /tmp/c.json
          node -e '
            const d = require("/tmp/c.json");
            const t = JSON.stringify(d).toLowerCase();
            if (/price|cost|fee|subscription/.test(t) && !/free|none/.test(t)) {
              console.log("Zahlungswort ohne free/none — nachsehen."); process.exit(1);
            }
            console.log("Eintritt kostenlos bestätigt.");
          '
